<!doctype html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <link rel="stylesheet" type="text/css" href="style/3rdParty/reset200802.css">
    <link rel="stylesheet" type="text/css" href="style/mystyle.css">
    <meta charset="UTF-8" />
    <title>Predator</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
    <script src="js/3rdParty/three.min.js"></script>
    <style>
      body { margin: 0; }
      canvas { width: 100%; height: 100% }
    </style>
  </head>
  <body>
    <div id="model-selector" class="model-selector" role="dialog" aria-modal="true" aria-labelledby="model-selector-title">
      <div class="model-selector-panel">
        <h1 id="model-selector-title">Choose an aircraft</h1>
        <p>Select a model to start the simulation.</p>
        <div class="model-selector-options">
          <button type="button" onclick="startSimulation('predator')">Predator MQ-9</button>
          <button type="button" onclick="startSimulation('c101')">CASA C-101</button>
        </div>
        <p id="model-selector-status" class="model-selector-status" aria-live="polite"></p>
      </div>
    </div>

    <div class="float-button gear-position" onclick="gearChange()"><img class="landing-gear" src="assets/noun_plane wheel_1671535.svg" alt="plane rotating"></div>

    <div class="float-button camera-position" onclick="cameraPosition()"><img class="landing-gear" src="assets/noun_Camera_3601420.svg" alt="plane rotating"></div>

    <div class="float-button gbu-position" onclick="launchBomb()"><img class="landing-gear" src="assets/noun_Bomb_933214.svg" alt="plane rotating"></div>

    <div class="float-button-big heading-position" onclick="heading()">
      <div class="float-button-big-content">
        <p class="center-text">HDG</p>
      </div>
    </div>

    <div class="float-button-big altitude-position" onclick="holdAltitude()">
      <div class="float-button-big-content">
        <p class="center-text">ALT</p>
      </div>
    </div>

    <div class="float-button-big hold-speed" onclick="holdSpeed()">
      <div class="float-button-big-content">
        <p class="center-text">SPD</p>
      </div>
    </div>

    <div id="flight-joystick" class="flight-joystick" role="application" aria-label="Joystick: move horizontally to control roll and vertically to control pitch">
      <div class="flight-joystick-base">
        <div id="flight-joystick-stick" class="flight-joystick-stick"></div>
      </div>
      <span class="joystick-label joystick-roll-label">ROLL</span>
      <span class="joystick-label joystick-pitch-label">PITCH</span>
    </div>

    <input id="throttle" class="throttle-slider thrust slider" type="range"/>

    <div class="float-button-big showSpeed">
      <div class="float-button-big-content">
        <p id="speedMeter" class="center-text">0 Km/h</p>
      </div>
    </div>

    <script src="js/perlin.js"></script>
    <script src="js/explosion.js"></script>
    <script src="js/OBJLoader.js"></script>
    <script src="js/MTLLoader.js"></script>
    <script src="js/OrbitControls.js"></script>
    <script src="js/Gauge.js"></script>
    <script src="js/terrain.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/system/landingGear.js"></script>
    <script src="js/system/weaponSystem.js"></script>
    <script src="js/keyboardHandler.js"></script>
    <script src="js/angle_utils.js"></script>
    <script src="js/flight_model.js"></script>
    <script src="js/index.js"></script>
  </body>
</html>
